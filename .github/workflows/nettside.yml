# Bygger og publiserer nettsiden på GitHub Pages.
# Kjører to ganger i timen (nye YouTube-videoer), når noe endres, og når du legger ut et innlegg.
# Alt skjer i skyen hos GitHub – PC-en trenger ikke være på.
name: Oppdater nettsiden

on:
  push:
    branches: [main, master]
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bygg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Hent videoer og innlegg
        run: node oppdater.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Hold den automatiske oppdateringen i gang
        if: github.event_name == 'schedule'
        run: if [ "$(date -u +%H)" = "03" ]; then gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/nettside.yml/enable" || true; fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publiser:
    needs: bygg
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
